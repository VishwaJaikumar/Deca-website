<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Points Summary</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="shared-sidebar.js"></script>
  <script type="module" src="firebase-db.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>

  <style>
    /* Minimal overrides and additions */
    main.content {
      margin-left: 280px;
      padding: 2rem 1rem;
      min-height: 100vh;
      transition: margin-left 0.3s ease;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    main.content.expanded {
      margin-left: 70px;
    }

    .container {
      max-width: 600px;
      width: 100%;
      background: #fff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      color: #0d3b66;
      margin-bottom: 1.5rem;
      font-weight: 600;
      font-size: 2.4rem;
    }

    #searchBox {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 20px;
      transition: border-color 0.3s ease;
    }

    #searchBox:focus {
      outline: none;
      border-color: #1a73e8;
    }

    .table-wrapper {
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid #e0e0e0;
    }

    th {
      background-color: #1a73e8;
      color: white;
      font-weight: 600;
    }

    tr:hover {
      background-color: #f5f5f5;
    }

    .loading {
      display: none;
      justify-content: center;
      align-items: center;
      margin: 30px 0;
      color: #666;
    }

    .loading.active {
      display: flex;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #1a73e8;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin-right: 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-message {
      color: #e53935;
      text-align: center;
      padding: 20px;
      background: #ffebee;
      border-radius: 8px;
      margin: 20px 0;
    }

    .no-data {
      text-align: center;
      color: #666;
      padding: 30px;
      font-style: italic;
    }

    @media (max-width: 700px) {
      main.content {
        margin-left: 0;
        padding: 1rem;
      }
      
      .container {
        padding: 1rem;
      }

      h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <main class="content">
    <div class="container" role="main">
      <h1>Points Summary</h1>
      <input
        type="search"
        id="searchBox"
        placeholder="Search by member name..."
        aria-label="Search by member name"
      />

      <div class="loading active" id="loading-summary">
        <div class="spinner"></div>
        <span>Loading points summary...</span>
      </div>

      <div id="errorContainer"></div>

      <div class="table-wrapper" id="tableWrapper" style="display: none;">
        <table aria-label="Points Summary Table" id="pointsSummary">
          <thead>
            <tr>
              <th>Member</th>
              <th>Attendance Points</th>
              <th>Adjustments</th>
              <th>Total Points</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    const pointsSummaryBody = document.querySelector("#pointsSummary tbody");
    const loadingSummary = document.getElementById("loading-summary");
    const searchBox = document.getElementById("searchBox");
    const tableWrapper = document.getElementById("tableWrapper");
    const errorContainer = document.getElementById("errorContainer");

    let allPoints = []; // Keep all points data here for filtering

    async function loadPointsSummary() {
      try {
        // Wait for firebase to be ready
        if (!window.firebaseReady) {
          await new Promise(resolve => window.addEventListener('firebaseReady', resolve, { once: true }));
        }

        // Use the shared Firebase DB helper to get member points summary
        const memberPointsData = await window.FirebaseDB.getMemberPointsSummary();
        
        // Convert to the format expected by the rendering function
        allPoints = memberPointsData
          .map(member => ({
            name: member.name,
            totalPoints: member.totalPoints,
            attendancePoints: member.attendancePoints,
            adjustmentPoints: member.adjustmentPoints
          }))
          .sort((a, b) => b.totalPoints - a.totalPoints);

        renderTable(allPoints);
        
        // Hide loading, show table
        loadingSummary.classList.remove('active');
        tableWrapper.style.display = 'block';

      } catch (error) {
        console.error('Error loading points summary:', error);
        loadingSummary.classList.remove('active');
        errorContainer.innerHTML = `
          <div class="error-message">
            <strong>Error loading points data:</strong> ${error.message}
          </div>
        `;
      }
    }

    function renderTable(pointsArray) {
      pointsSummaryBody.innerHTML = "";
      
      if (pointsArray.length === 0) {
        pointsSummaryBody.innerHTML = `
          <tr>
            <td colspan="4" class="no-data">No members with points found.</td>
          </tr>
        `;
        return;
      }
      
      pointsArray.forEach(({ name, totalPoints, attendancePoints, adjustmentPoints }) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${escapeHtml(name)}</td>
          <td>${attendancePoints || 0}</td>
          <td>${adjustmentPoints || 0}</td>
          <td><strong>${totalPoints}</strong></td>
        `;
        pointsSummaryBody.appendChild(tr);
      });
    }

    // Search functionality
    searchBox.addEventListener("input", () => {
      const searchTerm = searchBox.value.trim().toLowerCase();
      const filtered = allPoints.filter(({ name }) => 
        name.toLowerCase().includes(searchTerm)
      );
      renderTable(filtered);
    });

    // Basic HTML escaping
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Load data when page loads
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', loadPointsSummary);
    } else {
      loadPointsSummary();
    }

    // Listen for global data change events to refresh the table in real-time
    window.addEventListener('attendanceDataChanged', loadPointsSummary);
    window.addEventListener('pointsDataChanged', loadPointsSummary);
  </script>
</body>
</html>
