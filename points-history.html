<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Points History - Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script type="module" src="firebase-db.js"></script>
    <script src="shared-sidebar.js"></script>

    <style>
        .history-container {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .page-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .page-header h1 {
            color: #1a73e8;
            font-size: 28px;
            margin-bottom: 10px;
        }
        .page-header p {
            color: #666;
            font-size: 16px;
        }
        .search-bar {
            width: 100%;
            max-width: 500px;
            margin: 0 auto 30px;
            position: relative;
        }
        .search-bar input {
            width: 100%;
            padding: 12px 20px;
            padding-left: 45px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .search-bar input:focus {
            border-color: #1a73e8;
            box-shadow: 0 0 0 3px rgba(26,115,232,0.1);
            outline: none;
        }
        .search-bar i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
        }
        .history-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            padding: 10px;
        }
        .history-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .history-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        .history-card.active {
            border-left: 5px solid #1a73e8;
        }
        .history-card.officer {
            border-left: 5px solid #ffc107;
        }
        .history-card.advisor {
            border-left: 5px solid #dc3545;
        }
        .member-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        .member-avatar {
            width: 50px;
            height: 50px;
            background: #e3f2fd;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            color: #1a73e8;
            font-size: 20px;
            font-weight: 500;
        }
        .member-info {
            flex: 1;
        }
        .member-name {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin: 0 0 5px 0;
        }
        .member-type {
            font-size: 14px;
            color: #666;
            margin: 0;
        }
        .points-timeline {
            margin-top: 20px;
            position: relative;
            padding-left: 30px;
        }
        .timeline-item {
            position: relative;
            padding-bottom: 20px;
        }
        .timeline-item:last-child {
            padding-bottom: 0;
        }
        .timeline-item::before {
            content: '';
            position: absolute;
            left: -30px;
            top: 0;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #1a73e8;
            border: 3px solid white;
            box-shadow: 0 0 0 2px #1a73e8;
        }
        .timeline-item::after {
            content: '';
            position: absolute;
            left: -21px;
            top: 20px;
            width: 2px;
            height: calc(100% - 20px);
            background: #e0e0e0;
        }
        .timeline-item:last-child::after {
            display: none;
        }
        .timeline-content {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .timeline-points {
            font-size: 18px;
            font-weight: 600;
            color: #1a73e8;
            margin-bottom: 5px;
        }
        .timeline-reason {
            color: #666;
            font-size: 14px;
            margin-bottom: 5px;
        }
        .timeline-date {
            color: #999;
            font-size: 12px;
        }
        .total-points {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
        }
        .total-points-value {
            font-size: 24px;
            font-weight: 600;
            color: #1a73e8;
        }
        .total-points-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .filter-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 20px;
            background: white;
            color: #666;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 500;
        }
        .filter-btn:hover, .filter-btn.active {
            background: #1a73e8;
            color: white;
            border-color: #1a73e8;
        }
        .no-history {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 16px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .member-details {
            margin-top: 15px;
        }
        .detail-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            color: #555;
            font-size: 14px;
        }
        .detail-item i {
            width: 20px;
            margin-right: 10px;
            color: #1a73e8;
        }
    </style>
</head>
<body>
    
    <main class="content">
        <div class="history-container">
            <div class="page-header">
                <h1>Points History</h1>
                <p>Track points history for all chapter members</p>
            </div>

            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search members by name or email...">
            </div>

            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">All Members</button>
                <button class="filter-btn" data-filter="active">Active Members</button>
                <button class="filter-btn" data-filter="officer">Officers</button>
                <button class="filter-btn" data-filter="advisor">Advisors</button>
            </div>

            <div class="history-grid" id="historyGrid">
                <!-- History cards will be populated here -->
            </div>
        </div>
    </main>

    <script>
       

            // History functionality
            const historyGrid = document.getElementById('historyGrid');
            const searchInput = document.getElementById('searchInput');
            const filterButtons = document.querySelectorAll('.filter-btn');
            let currentFilter = 'all';

            function getInitials(name) {
                return name.split(' ')
                    .map(word => word[0])
                    .join('')
                    .toUpperCase();
            }

            function formatDate(dateString) {
                const date = new Date(dateString);
                return date.toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            }

            function displayHistory(members) {
                if (members.length === 0) {
                    historyGrid.innerHTML = `
                        <div class="no-history">
                            <i class="fas fa-history" style="font-size: 48px; color: #ccc; margin-bottom: 20px;"></i>
                            <p>No history found</p>
                        </div>
                    `;
                    return;
                }

                historyGrid.innerHTML = members.map((member, index) => {
                    // Determine the member type class and icon
                    let typeClass = '';
                    let typeIcon = '';
                    switch(member.type.toLowerCase()) {
                        case 'officer':
                            typeClass = 'officer';
                            typeIcon = 'fa-crown';
                            break;
                        case 'advisor':
                            typeClass = 'advisor';
                            typeIcon = 'fa-user-tie';
                            break;
                        default:
                            typeClass = 'active';
                            typeIcon = 'fa-user';
                    }

                    // Get points history for this member from Firebase data
                    const memberPointsHistory = allPointsHistory.filter(entry => 
                        entry.memberId === member.id || entry.email === member.email
                    ).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

                    const totalPoints = member.totalPoints || 0;

                    return `
                        <div class="history-card ${typeClass}" id="member-${index}">
                            <div class="member-header">
                                <div class="member-avatar">
                                    ${getInitials(member.name)}
                                </div>
                                <div class="member-info">
                                    <h3 class="member-name">${member.name}</h3>
                                    <p class="member-type">
                                        <i class="fas ${typeIcon}"></i> ${member.type}
                                    </p>
                                </div>
                            </div>
                            <div class="total-points">
                                <div class="total-points-value">${totalPoints}</div>
                                <div class="total-points-label">Total Points</div>
                            </div>
                            <div class="points-timeline">
                                ${memberPointsHistory.map(entry => `
                                    <div class="timeline-item">
                                        <div class="timeline-content">
                                            <div class="timeline-points">
                                                ${entry.points > 0 ? '+' : ''}${entry.points} points
                                            </div>
                                            <div class="timeline-reason">${entry.reason || 'Points adjustment'}</div>
                                            <div class="timeline-date">${formatDate(entry.timestamp)}</div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                            <div class="member-details">
                                <div class="detail-item">
                                    <i class="fas fa-envelope"></i>
                                    <span>${member.email}</span>
                                </div>
                                <div class="detail-item">
                                    <i class="fas fa-trophy"></i>
                                    <span>${member.event}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            function filterMembers(searchTerm, filter) {
                const members = allMembers;
                let filtered = members;

                // Apply search filter
                if (searchTerm) {
                    filtered = filtered.filter(member => 
                        member.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        member.email.toLowerCase().includes(searchTerm.toLowerCase())
                    );
                }

                // Apply type filter
                if (filter !== 'all') {
                    filtered = filtered.filter(member => 
                        member.type.toLowerCase() === filter.toLowerCase()
                    );
                }

                displayHistory(filtered);
            }

            // Search functionality
            searchInput.addEventListener('input', (e) => {
                filterMembers(e.target.value, currentFilter);
            });

            // Filter buttons functionality
            filterButtons.forEach(button => {
                button.addEventListener('click', () => {
                    filterButtons.forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');
                    currentFilter = button.dataset.filter;
                    filterMembers(searchInput.value, currentFilter);
                });
            });

            // Initial display
            loadDataFromFirebase();


            // No need for localStorage event listeners since we're using Firebase
        });

        let allMembers = [];
        let allPointsHistory = [];

        async function loadDataFromFirebase() {
            try {
                // Load members summary (attendance + adjustments) and raw points history
                allMembers = await window.FirebaseDB.getMemberPointsSummary();
                allPointsHistory = await window.FirebaseDB.getPointsHistory();
                
                filterMembers(searchInput.value, currentFilter);
            } catch (error) {
                console.error('Error loading data:', error);
                historyGrid.innerHTML = `
                    <div class="no-history">
                        <p>Error loading data. Please refresh the page.</p>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
