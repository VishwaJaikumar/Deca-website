<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Minutes Log - Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script type="module" src="firebase-db.js"></script>
    <script src="shared-sidebar.js"></script>

    <style>
        .view-container {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .page-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .page-header h1 {
            color: #1a73e8;
            font-size: 28px;
            margin-bottom: 10px;
        }
        .page-header p {
            color: #666;
            font-size: 16px;
        }
        .filters-section {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        .filters-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            align-items: end;
        }
        .filter-group {
            margin-bottom: 0;
        }
        .filter-group label,
        .filter-group input,
        .filter-group select {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 400;
        }
        .filter-group label {
            margin-bottom: 4px;
            font-size: 13px;
        }
        .filter-group input,
        .filter-group select {
            width: 100%;
            max-width: 100%;
            min-width: 0;
            padding: 7px 8px;
            border-radius: 5px;
            font-size: 13px;
            border: 1.5px solid #cfd8dc;
            background: #fff;
            color: #222;
            box-shadow: none;
            outline: none;
            transition: border-color 0.2s;
        }
        .filter-group input[type="search"],
        .filter-group input[type="date"] {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 400;
            border: 1.5px solid #cfd8dc;
            background: #fff;
            color: #222;
        }
        .filter-group input[type="date"] {
            max-width: 100%;
        }
        .date-range-bar {
            display: flex;
            gap: 4px;
            align-items: center;
        }
        .date-range-bar span {
            font-size: 13px;
        }
        .filter-group input:focus,
        .filter-group select:focus {
            border-color: #1a73e8;
            box-shadow: 0 0 0 2px rgba(26,115,232,0.08);
        }
        .minutes-list {
            display: grid;
            gap: 20px;
        }
        .minutes-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }
        .minutes-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        .minutes-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }
        .minutes-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin: 0;
        }
        .minutes-meta {
            display: flex;
            gap: 15px;
            color: #666;
            font-size: 14px;
        }
        .minutes-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .minutes-meta i {
            color: #1a73e8;
        }
        .minutes-content {
            color: #666;
            font-size: 14px;
            margin-bottom: 15px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .minutes-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
        .participants-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .participant-tag {
            background: #e3f2fd;
            color: #1a73e8;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .view-details-btn {
            background: none;
            border: none;
            color: #1a73e8;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .view-details-btn:hover {
            color: #1557b0;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
        }
        .modal-content {
            position: relative;
            background: white;
            width: 90%;
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;
            border-radius: 12px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .close-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 24px;
            color: #666;
            cursor: pointer;
        }
        .modal-header {
            margin-bottom: 20px;
        }
        .modal-title {
            font-size: 24px;
            color: #333;
            margin: 0 0 10px 0;
        }
        .modal-meta {
            display: flex;
            gap: 20px;
            color: #666;
            font-size: 14px;
        }
        .modal-section {
            margin-bottom: 20px;
        }
        .modal-section h3 {
            color: #333;
            font-size: 16px;
            margin: 0 0 10px 0;
        }
        .modal-section p {
            color: #666;
            font-size: 14px;
            margin: 0;
            white-space: pre-wrap;
        }
        .action-items-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .action-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        .action-item:last-child {
            border-bottom: none;
        }
        .action-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
        }
        .action-item.completed {
            color: #666;
            text-decoration: line-through;
        }
        .no-minutes {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 16px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .loading-message {
            text-align: center;
            padding: 20px;
            color: #666;
        }
    </style>
</head>
<body>
    <main class="content">
        <div class="view-container">
            <div class="page-header">
                <h1>Minutes Log</h1>
                <p>View and manage meeting minutes and activity records</p>
            </div>

            <div class="filters-section">
                <div class="filters-grid">
                    <div class="filter-group">
                        <label for="searchInput">Search</label>
                        <input type="text" id="searchInput" placeholder="Search by name or type...">
                    </div>
                    <div class="filter-group">
                        <label for="typeFilter">Activity Type</label>
                        <select id="typeFilter">
                            <option value="">All Types</option>
                            <option value="chapter">Chapter Meeting</option>
                            <option value="competition">Competition Meeting</option>
                            <option value="officer">Officer Meeting</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="dateFilterStart">Date Range</label>
                        <div class="date-range-bar">
                            <input type="date" id="dateFilterStart" placeholder="Start date">
                            <span style="font-size: 15px; color: #888;">to</span>
                            <input type="date" id="dateFilterEnd" placeholder="End date">
                        </div>
                    </div>
                    <div class="filter-group">
                        <label for="participantFilter">Participant</label>
                        <select id="participantFilter">
                            <option value="">All Participants</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="minutes-list" id="minutesList">
                <div class="loading-message">Loading minutes...</div>
            </div>
        </div>
    </main>

    <div id="minutesModal" class="modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal()">&times;</button>
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle"></h2>
                <div class="modal-meta" id="modalMeta"></div>
            </div>
            <div class="modal-section">
                <h3>Purpose/Agenda</h3>
                <p id="modalPurpose"></p>
            </div>
            <div class="modal-section">
                <h3>Notes</h3>
                <p id="modalNotes"></p>
            </div>
            <div class="modal-section">
                <h3>Participants</h3>
                <div class="participants-list" id="modalParticipants"></div>
            </div>
            <div style="display: flex; gap: 12px; margin-top: 20px;">
                <button class="view-details-btn" style="color: #e53935;" id="modalDeleteBtn">
                    <i class="fas fa-trash"></i> Delete
                </button>
                <button class="view-details-btn" style="color: #fbc02d;" id="modalEditBtn">
                    <i class="fas fa-edit"></i> Edit
                </button>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteConfirmModal" class="modal">
        <div class="modal-content" style="max-width: 400px; text-align: center;">
            <h2 style="color: #e53935;">Confirm Delete</h2>
            <p>Are you sure you want to delete this minutes entry?</p>
            <div style="margin-top: 24px; display: flex; gap: 16px; justify-content: center;">
                <button class="view-details-btn" style="color: #e53935;" id="confirmDeleteBtn">Delete</button>
                <button class="view-details-btn" id="cancelDeleteBtn">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        let allMinutes = [];
        let allMembers = [];
        let deleteIndex = null;
        let detailsIndex = null;

        document.addEventListener('DOMContentLoaded', async () => {
            console.log('DOM loaded, initializing...');
            
            // Wait for Firebase to be ready
            if (window.firebaseReady) {
                await initializeApp();
            } else {
                window.addEventListener('firebaseReady', initializeApp);
            }

            // Event listeners for filters
            document.getElementById('searchInput').addEventListener('input', displayMinutes);
            document.getElementById('typeFilter').addEventListener('change', displayMinutes);
            document.getElementById('dateFilterStart').addEventListener('change', displayMinutes);
            document.getElementById('dateFilterEnd').addEventListener('change', displayMinutes);
            document.getElementById('participantFilter').addEventListener('change', displayMinutes);

            // Delete confirmation handlers
            document.getElementById('confirmDeleteBtn').onclick = confirmDelete;
            document.getElementById('cancelDeleteBtn').onclick = cancelDelete;
        });

        async function initializeApp() {
            console.log('Firebase ready, loading data...');
            try {
                // Load data from Firebase
                allMembers = await window.FirebaseDB.getMembers();
                allMinutes = await window.FirebaseDB.getMinutes();
                
                console.log('Loaded members:', allMembers);
                console.log('Loaded minutes:', allMinutes);
                
                // Populate participant filter
                loadParticipants();
                
                // Display minutes
                displayMinutes();
            } catch (error) {
                console.error('Error initializing app:', error);
                document.getElementById('minutesList').innerHTML = `
                    <div class="no-minutes">
                        <p>Error loading data. Please refresh the page.</p>
                    </div>
                `;
            }
        }

        function loadParticipants() {
            const participantFilter = document.getElementById('participantFilter');
            participantFilter.innerHTML = '<option value="">All Participants</option>' +
                allMembers.map(member => `
                    <option value="${member.email}">${member.name}</option>
                `).join('');
        }

        function formatDate(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            if (isNaN(date.getTime())) return '';
            return date.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function toTitleCase(str) {
            if (!str) return '';
            const map = {
                chapter: 'Chapter Meeting',
                competition: 'Competition Meeting',
                officer: 'Officer Meeting',
                other: 'Other'
            };
            if (map[str.toLowerCase()]) return map[str.toLowerCase()];
            return str.replace(/\w\S*/g, (txt) => txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase());
        }

        function displayMinutes() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const typeFilter = document.getElementById('typeFilter').value;
            const dateFilterStart = document.getElementById('dateFilterStart').value;
            const dateFilterEnd = document.getElementById('dateFilterEnd').value;
            const participantFilter = document.getElementById('participantFilter').value;

            let filtered = [...allMinutes];

            // Apply filters
            if (searchTerm) {
                filtered = filtered.filter(minute => 
                    (minute.activityName && minute.activityName.toLowerCase().includes(searchTerm)) ||
                    (minute.activityType && minute.activityType.toLowerCase().includes(searchTerm)) ||
                    (minute.purpose && minute.purpose.toLowerCase().includes(searchTerm))
                );
            }

            if (typeFilter) {
                filtered = filtered.filter(minute => 
                    minute.activityType === typeFilter
                );
            }

            if (dateFilterStart || dateFilterEnd) {
                filtered = filtered.filter(minute => {
                    let dateField = minute.startDateTime || minute.activityDate;
                    const entryDate = dateField ? new Date(dateField) : null;
                    let afterStart = true, beforeEnd = true;
                    
                    if (dateFilterStart) {
                        const start = new Date(dateFilterStart);
                        afterStart = entryDate && entryDate >= start;
                    }
                    if (dateFilterEnd) {
                        const end = new Date(dateFilterEnd);
                        end.setDate(end.getDate() + 1);
                        beforeEnd = entryDate && entryDate < end;
                    }
                    return afterStart && beforeEnd;
                });
            }

            if (participantFilter) {
                filtered = filtered.filter(minute => 
                    minute.participants && minute.participants.includes(participantFilter)
                );
            }

            // Sort by most recent first
            filtered.sort((a, b) => new Date(b.timestamp || b.startDateTime) - new Date(a.timestamp || a.startDateTime));

            const minutesList = document.getElementById('minutesList');

            if (filtered.length === 0) {
                minutesList.innerHTML = `
                    <div class="no-minutes">
                        <i class="fas fa-clipboard-list" style="font-size: 48px; color: #ccc; margin-bottom: 20px;"></i>
                        <p>No minutes found</p>
                    </div>
                `;
                return;
            }

            minutesList.innerHTML = filtered.map((minute, index) => {
                const originalIndex = allMinutes.findIndex(m => m.id === minute.id);
                let dateField = minute.startDateTime || minute.activityDate;
                
                return `
                <div class="minutes-card" onclick="showDetails(${originalIndex})">
                    <div class="minutes-header">
                        <h3 class="minutes-title">${toTitleCase(minute.activityName || minute.activityType)}</h3>
                        <div class="minutes-meta">
                            <span><i class="fas fa-clock"></i> ${minute.duration || '0:00'}</span>
                            <span><i class="fas fa-calendar"></i> ${formatDate(dateField)}</span>
                        </div>
                    </div>
                    <div class="minutes-content">${minute.purpose || 'No purpose specified'}</div>
                    <div class="minutes-footer">
                        <div class="participants-list">
                            ${(minute.participants || []).map(email => {
                                const member = allMembers.find(m => m.email === email);
                                return member ? `
                                    <div class="participant-tag">
                                        <i class="fas fa-user"></i>
                                        ${member.name}
                                    </div>
                                ` : '';
                            }).join('')}
                        </div>
                        <div style="display: flex; gap: 8px;">
                            <button class="view-details-btn" onclick="event.stopPropagation(); showDetails(${originalIndex});">
                                View Details <i class="fas fa-chevron-right"></i>
                            </button>
                            <button class="view-details-btn" style="color: #e53935;" onclick="event.stopPropagation(); confirmDeleteMinute(${originalIndex});">
                                <i class="fas fa-trash"></i> Delete
                            </button>
                            <button class="view-details-btn" style="color: #fbc02d;" onclick="event.stopPropagation(); editMinute(${originalIndex});">
                                <i class="fas fa-edit"></i> Edit
                            </button>
                        </div>
                    </div>
                </div>
            `;
            }).join('');
        }

        function confirmDeleteMinute(index) {
            deleteIndex = index;
            document.getElementById('deleteConfirmModal').style.display = 'block';
        }

        async function confirmDelete() {
            if (deleteIndex !== null) {
                try {
                    const minute = allMinutes[deleteIndex];
                    if (minute && minute.id) {
                        // You'll need to implement deleteMinutes in firebase-db.js
                        alert('Delete functionality needs to be implemented in Firebase');
                        // await window.FirebaseDB.deleteMinutes(minute.id);
                        // allMinutes = await window.FirebaseDB.getMinutes();
                        // displayMinutes();
                    }
                } catch (error) {
                    console.error('Error deleting minute:', error);
                    alert('Error deleting minute. Please try again.');
                }
                deleteIndex = null;
                document.getElementById('deleteConfirmModal').style.display = 'none';
                closeModal();
            }
        }

        function cancelDelete() {
            deleteIndex = null;
            document.getElementById('deleteConfirmModal').style.display = 'none';
        }

        function editMinute(index) {
            window.location.href = `minutes-track.html?edit=${index}`;
        }

        function showDetails(index) {
            detailsIndex = index;
            const minute = allMinutes[index];

            document.getElementById('modalTitle').textContent = toTitleCase(minute.activityName || minute.activityType);
            let dateField = minute.startDateTime || minute.activityDate;
            document.getElementById('modalMeta').innerHTML = `
                <span><i class="fas fa-clock"></i> ${minute.duration || '0:00'}</span>
                <span><i class="fas fa-calendar"></i> ${formatDate(dateField)}</span>
                <span><i class="fas fa-tag"></i> ${toTitleCase(minute.activityType)}</span>
            `;
            document.getElementById('modalPurpose').textContent = minute.purpose || 'No purpose specified';
            document.getElementById('modalNotes').textContent = minute.notes || 'No notes available';

            // Participants
            const participantsList = document.getElementById('modalParticipants');
            participantsList.innerHTML = (minute.participants || []).map(email => {
                const member = allMembers.find(m => m.email === email);
                return member ? `
                    <div class="participant-tag">
                        <i class="fas fa-user"></i>
                        ${member.name}
                    </div>
                ` : '';
            }).join('');

            document.getElementById('minutesModal').style.display = 'block';
            document.getElementById('modalDeleteBtn').onclick = () => confirmDeleteMinute(index);
            document.getElementById('modalEditBtn').onclick = () => editMinute(index);
        }

        function closeModal() {
            document.getElementById('minutesModal').style.display = 'none';
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('minutesModal');
            const deleteModal = document.getElementById('deleteConfirmModal');
            if (event.target === modal) {
                closeModal();
            }
            if (event.target === deleteModal) {
                cancelDelete();
            }
        }
    </script>
</body>
</html>
